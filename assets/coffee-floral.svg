<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <!-- Coffee branches, cherries and blossoms: a faint repeating watermark -->
  <defs>
    <g id="leaf">
      <path d="M0 0C34-30 118-32 170 0C118 32 34 30 0 0Z"/>
      <path d="M8 0H160"/>
      <path d="M38 0q14-10 22-20M72 0q14-12 24-22M106 0q12-10 20-17M38 0q14 10 22 20M72 0q14 12 24 22M106 0q12 10 20 17"/>
    </g>
    <g id="cherry"><circle r="13"/><path d="M-4-5q4-4 8 0"/></g>
    <path id="petal" d="M0-5C6-13 6-28 0-36C-6-28-6-13 0-5Z"/>
    <g id="flower">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
      <circle r="4"/>
    </g>
  </defs>

  <g fill="none" stroke="#e3e1d8" stroke-opacity=".065" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Branch A: rising from the bottom left -->
    <path d="M60 830C150 730 250 610 440 470"/>
    <use href="#leaf" transform="translate(132 748) rotate(-108) scale(.82)"/>
    <use href="#leaf" transform="translate(132 748) rotate(4) scale(.82)"/>
    <use href="#cherry" transform="translate(116 784)"/>
    <use href="#cherry" transform="translate(140 794)"/>
    <use href="#cherry" transform="translate(126 810)"/>
    <use href="#leaf" transform="translate(232 638) rotate(-100)"/>
    <use href="#leaf" transform="translate(232 638) rotate(12)"/>
    <use href="#flower" transform="translate(196 612) rotate(10)"/>
    <use href="#flower" transform="translate(262 676) rotate(40) scale(.8)"/>
    <use href="#leaf" transform="translate(338 548) rotate(-96) scale(.9)"/>
    <use href="#leaf" transform="translate(338 548) rotate(16) scale(.9)"/>
    <use href="#cherry" transform="translate(360 580)"/>
    <use href="#cherry" transform="translate(384 572)"/>
    <use href="#leaf" transform="translate(440 470) rotate(-42) scale(.7)"/>

    <!-- Branch B: hanging from the top right -->
    <path d="M850 80C770 150 690 250 560 380"/>
    <use href="#leaf" transform="translate(792 132) rotate(78) scale(.8)"/>
    <use href="#leaf" transform="translate(792 132) rotate(190) scale(.8)"/>
    <use href="#leaf" transform="translate(716 214) rotate(84) scale(.9)"/>
    <use href="#leaf" transform="translate(716 214) rotate(196) scale(.9)"/>
    <use href="#cherry" transform="translate(690 196)"/>
    <use href="#cherry" transform="translate(700 172)"/>
    <use href="#cherry" transform="translate(676 174)"/>
    <use href="#flower" transform="translate(632 330) rotate(20) scale(.9)"/>
    <use href="#leaf" transform="translate(560 380) rotate(132) scale(.7)"/>

    <!-- Branch C: low on the right -->
    <path d="M860 860C800 790 720 710 610 660"/>
    <use href="#leaf" transform="translate(790 778) rotate(-188) scale(.75)"/>
    <use href="#leaf" transform="translate(790 778) rotate(-82) scale(.75)"/>
    <use href="#flower" transform="translate(700 700) rotate(-12)"/>
    <use href="#flower" transform="translate(664 742) rotate(30) scale(.7)"/>
    <use href="#leaf" transform="translate(610 660) rotate(-160) scale(.65)"/>

    <!-- Loose blossoms and cherries -->
    <use href="#flower" transform="translate(130 150) rotate(15)"/>
    <use href="#flower" transform="translate(300 96) rotate(-20) scale(.7)"/>
    <use href="#cherry" transform="translate(96 330)"/>
    <use href="#cherry" transform="translate(120 342)"/>
    <use href="#flower" transform="translate(470 720) rotate(50) scale(.8)"/>
    <use href="#cherry" transform="translate(520 170)"/>
    <use href="#cherry" transform="translate(544 160)"/>
    <use href="#cherry" transform="translate(532 186)"/>
  </g>
</svg>
